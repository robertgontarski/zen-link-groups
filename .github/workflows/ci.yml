name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Unit tests
        run: node --test test/*.test.mjs
      - name: Installer and manifest
        run: python3 -I -m unittest discover -s test -p 'test_*.py' -v
      - name: Lint installer
        run: shellcheck install.sh
